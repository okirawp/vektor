name: Emülatör ekran görüntüleri
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Uygulama ve ekran testi APK’ları
        run: scripts/ci/gradle.sh -PciScreenshots=true :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Emülatör için KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 üzerinde altı ekranı doğrula ve kaydet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: scripts/ci/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vektor-ekran-goruntuleri
          path: ci-output/screenshots/*.png
          if-no-files-found: error
      - name: Sorunu özetle
        if: failure()
        run: |
          if test -f ci-output/instrumentation.log; then
            { echo '### Emülatör ekran testi'; echo '~~~text'; tail -12 ci-output/instrumentation.log; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ekran çekimi tamamlanamadı. İlk kırmızı adımın SDK, derleme veya emülatör günlüğüne bak.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ekran-tani
          path: ci-output/
