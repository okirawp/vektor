name: Derleme ve test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Eşleme ve yedek biçimi testleri
        run: |
          set -o pipefail
          mkdir -p ci-output
          if ! scripts/ci/host-tests.sh 2>&1 | tee ci-output/host.log; then
            { echo '### Davranış testi başarısız'; echo '~~~text'; tail -8 ci-output/host.log; echo '~~~'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: APK ve Android birim testleri
        run: scripts/ci/gradle.sh :app:assembleDebug :app:testReleaseUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Vektor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: derleme-tani
          path: |
            ci-output/
            app/build/reports/tests/
            app/build/test-results/
