plugins { id 'com.android.application' }
def previewModels = ['controller-dark.glb', 'controller-light.glb'].every { file("src/main/assets/${it}").isFile() }
def compilePreview3d = previewModels || providers.gradleProperty('verifyPreview3d').orNull == 'true'
def screenshotTests = providers.gradleProperty('ciScreenshots').orNull == 'true'
android {
 namespace 'dev.kolmapper'
 if (compilePreview3d) sourceSets.main.java.srcDir('src/preview3d/java')
 compileSdk 36
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId 'dev.kolmapper'; minSdk 29; targetSdk 36; versionCode 18; versionName '1.6.0'; testInstrumentationRunner(screenshotTests ? 'dev.kolmapper.ScreenshotInstrumentation' : 'dev.kolmapper.ProfileInstrumentation') }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2" } }
 testBuildType(screenshotTests ? 'debug' : 'release')
 buildTypes { debug { applicationIdSuffix '.debug' }; release { debuggable false; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 if (compilePreview3d) implementation "com.google.android.filament:filament-utils-android:1.71.5"
 testImplementation "junit:junit:4.13.2"
 testImplementation "org.robolectric:robolectric:4.14.1"
 debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
}
